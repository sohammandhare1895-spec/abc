<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Management · GridSense</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ========== GLOBAL STYLES (CSS) ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f3f6fc;
      color: #1e293b;
      display: flex;
      min-height: 100vh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0b2b4e 0%, #0a1f38 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
      transition: all 0.2s;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2.5rem;
      padding-left: 8px;
    }

    .logo-icon {
      background: #facc15;
      color: #0b2b4e;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .logo-text {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: white;
    }

    .logo-text span {
      color: #facc15;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 500;
      color: #cbd5e1;
      transition: all 0.2s;
      cursor: default;
    }

    .nav-item i {
      width: 22px;
      font-size: 1.2rem;
      color: #94a3b8;
    }

    .nav-item.active {
      background: #1e3a5f;
      color: white;
    }

    .nav-item.active i {
      color: #facc15;
    }

    .nav-item:hover:not(.active) {
      background: #1e3a5f;
      color: white;
    }

    .nav-item:hover i {
      color: #facc15;
    }

    .user-profile {
      margin-top: auto;
      background: #0f2a44;
      border-radius: 16px;
      padding: 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      background: #facc15;
      color: #0b2b4e;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .user-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: white;
    }

    .user-info p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      flex: 1;
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .page-title h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0b2b4e;
      letter-spacing: -0.5px;
    }

    .page-title p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn {
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
      transition: 0.15s;
    }

    .btn-primary {
      background: #0b2b4e;
      color: white;
      box-shadow: 0 6px 14px rgba(11, 43, 78, 0.25);
    }

    .btn-primary i {
      color: #facc15;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #cbd5e1;
      color: #1e293b;
    }

    .btn-outline i {
      color: #0b2b4e;
    }

    /* ========== METRIC CARDS ========== */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: white;
      border-radius: 24px;
      padding: 1.5rem 1.2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      border: 1px solid #e9eef5;
      transition: transform 0.1s;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .metric-icon {
      background: #eef4ff;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #0b2b4e;
    }

    .metric-trend {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: #e6f7e6;
      color: #1e7b1e;
    }

    .metric-trend.down {
      background: #ffe9e9;
      color: #b91c1c;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: #0b2b4e;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
    }

    /* ========== CHART + SIDE PANEL ========== */
    .dashboard-panels {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .chart-card {
      background: white;
      border-radius: 28px;
      padding: 1.8rem 1.8rem 1.2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9eef5;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .chart-header h3 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .chart-header span {
      font-size: 0.8rem;
      background: #eef4ff;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      color: #0b2b4e;
    }

    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 180px;
      padding-top: 10px;
      gap: 8px;
    }

    .bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      gap: 8px;
    }

    .bar {
      width: 100%;
      background: linear-gradient(0deg, #1e4b7c, #2b6aa6);
      border-radius: 12px 12px 6px 6px;
      transition: height 0.3s;
      min-height: 6px;
    }

    .bar-label {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 500;
    }

    .bar-value {
      font-size: 0.7rem;
      font-weight: 600;
      color: #0b2b4e;
    }

    .side-panel {
      background: white;
      border-radius: 28px;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9eef5;
      display: flex;
      flex-direction: column;
    }

    .side-panel h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    .device-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-icon {
      background: #f1f6fe;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b2b4e;
      font-size: 1.2rem;
    }

    .device-details {
      flex: 1;
    }

    .device-name {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .device-status {
      font-size: 0.7rem;
      color: #64748b;
    }

    .device-power {
      font-weight: 700;
      color: #0b2b4e;
      font-size: 0.9rem;
    }

    .device-power span {
      font-weight: 400;
      font-size: 0.7rem;
      color: #64748b;
    }

    /* ========== ALERTS TABLE (mini) ========== */
    .alerts-section {
      background: white;
      border-radius: 28px;
      padding: 1.5rem 1.8rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9eef5;
    }

    .alerts-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #edf2f7;
    }

    .alert-row:last-child {
      border-bottom: none;
    }

    .alert-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .alert-badge {
      width: 10px;
      height: 10px;
      border-radius: 10px;
      background: #facc15;
    }

    .alert-badge.critical {
      background: #ef4444;
    }

    .alert-badge.info {
      background: #3b82f6;
    }

    .alert-text {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .alert-time {
      font-size: 0.75rem;
      color: #64748b;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1200px) {
      .metrics-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .dashboard-panels {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 1.2rem;
      }
      .nav-links {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .main-content {
        padding: 1.5rem;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- ========== SIDEBAR (HTML) ========== -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">Grid<span>Sense</span></div>
    </div>
    <nav class="nav-links">
      <div class="nav-item active"><i class="fas fa-chart-pie"></i> Dashboard</div>
      <div class="nav-item"><i class="fas fa-bolt"></i> Energy Flow</div>
      <div class="nav-item"><i class="fas fa-microchip"></i> Devices</div>
      <div class="nav-item"><i class="fas fa-file-invoice"></i> Billing</div>
      <div class="nav-item"><i class="fas fa-cog"></i> Settings</div>
    </nav>
    <div class="user-profile">
      <div class="user-avatar">JD</div>
      <div class="user-info">
        <h4>John Doe</h4>
        <p>Grid Manager</p>
      </div>
    </div>
  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="page-title">
        <h1>Electricity Overview</h1>
        <p>Real-time monitoring &amp; management · <span id="currentDate"></span></p>
      </div>
      <div class="action-buttons">
        <button class="btn btn-outline"><i class="fas fa-download"></i> Export</button>
        <button class="btn btn-primary"><i class="fas fa-plus"></i> New Meter</button>
      </div>
    </div>

    <!-- Metrics Cards (dynamic via JS) -->
    <div class="metrics-grid" id="metricsGrid">
      <!-- populated by JavaScript -->
    </div>

    <!-- Chart + Side panel -->
    <div class="dashboard-panels">
      <!-- Chart card -->
      <div class="chart-card">
        <div class="chart-header">
          <h3><i class="fas fa-chart-line" style="color: #0b2b4e; margin-right: 8px;"></i> Power consumption (kW)</h3>
          <span>Last 7 days</span>
        </div>
        <div class="chart-container" id="chartContainer">
          <!-- bars will be injected by JavaScript -->
        </div>
      </div>

      <!-- Side panel: top devices -->
      <div class="side-panel">
        <h3><i class="fas fa-plug" style="color: #0b2b4e;"></i> Active devices</h3>
        <div class="device-list" id="deviceList">
          <!-- JS will populate -->
        </div>
      </div>
    </div>

    <!-- Alerts / activity -->
    <div class="alerts-section">
      <h3><i class="fas fa-bell" style="color: #0b2b4e;"></i> Recent alerts</h3>
      <div id="alertsContainer">
        <!-- JS injects alerts -->
      </div>
    </div>
  </main>

  <!-- ========== JAVASCRIPT (all logic) ========== -->
  <script>
    (function() {
      // ---------- 1. SET CURRENT DATE ----------
      const dateEl = document.getElementById('currentDate');
      const today = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      dateEl.textContent = today.toLocaleDateString('en-US', options);

      // ---------- 2. METRICS DATA (simulated) ----------
      const metrics = [
        { 
          icon: 'fa-bolt', 
          value: '4,286', 
          unit: 'kWh', 
          label: 'Total consumption', 
          trend: '+8.2%', 
          trendUp: true 
        },
        { 
          icon: 'fa-indian-rupee-sign', 
          value: '₹18,420', 
          unit: '', 
          label: 'Estimated bill', 
          trend: '-3.1%', 
          trendUp: false 
        },
        { 
          icon: 'fa-gauge-high', 
          value: '2.4', 
          unit: 'kW', 
          label: 'Current demand', 
          trend: '+1.2%', 
          trendUp: true 
        },
        { 
          icon: 'fa-leaf', 
          value: '1.8', 
          unit: 'tCO₂', 
          label: 'Carbon footprint', 
          trend: '-5.3%', 
          trendUp: false 
        }
      ];

      const metricsGrid = document.getElementById('metricsGrid');
      metricsGrid.innerHTML = metrics.map(m => `
        <div class="metric-card">
          <div class="metric-header">
            <div class="metric-icon"><i class="fas ${m.icon}"></i></div>
            <div class="metric-trend ${m.trendUp ? '' : 'down'}">${m.trend}</div>
          </div>
          <div class="metric-value">${m.value}<span style="font-size:1rem; font-weight:500; color:#64748b; margin-left:4px;">${m.unit}</span></div>
          <div class="metric-label">${m.label}</div>
        </div>
      `).join('');

      // ---------- 3. CHART (7-day bars) ----------
      const chartData = [
        { day: 'Mon', value: 380, label: '380' },
        { day: 'Tue', value: 420, label: '420' },
        { day: 'Wed', value: 510, label: '510' },
        { day: 'Thu', value: 490, label: '490' },
        { day: 'Fri', value: 580, label: '580' },
        { day: 'Sat', value: 620, label: '620' },
        { day: 'Sun', value: 460, label: '460' }
      ];
      const maxVal = Math.max(...chartData.map(d => d.value));
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = chartData.map(item => {
        const heightPercent = (item.value / maxVal) * 100;
        return `
          <div class="bar-wrapper">
            <div class="bar-value">${item.label} kW</div>
            <div class="bar" style="height: ${heightPercent}%;"></div>
            <div class="bar-label">${item.day}</div>
          </div>
        `;
      }).join('');

      // ---------- 4. DEVICE LIST (active devices) ----------
      const devices = [
        { name: 'HVAC System', status: 'Running · 3.2 kW', icon: 'fa-fan', power: '3.2 kW' },
        { name: 'Server Rack A', status: 'Running · 1.8 kW', icon: 'fa-server', power: '1.8 kW' },
        { name: 'Lighting Grid', status: 'Standby · 0.4 kW', icon: 'fa-lightbulb', power: '0.4 kW' },
        { name: 'EV Charger', status: 'Charging · 7.2 kW', icon: 'fa-charging-station', power: '7.2 kW' }
      ];
      const deviceList = document.getElementById('deviceList');
      deviceList.innerHTML = devices.map(d => `
        <div class="device-item">
          <div class="device-icon"><i class="fas ${d.icon}"></i></div>
          <div class="device-details">
            <div class="device-name">${d.name}</div>
            <div class="device-status">${d.status}</div>
          </div>
          <div class="device-power">${d.power}<span> / max 8 kW</span></div>
        </div>
      `).join('');

      // ---------- 5. ALERTS (recent) ----------
      const alerts = [
        { type: 'critical', message: 'High voltage detected on Feeder 3', time: '2 min ago' },
        { type: 'warning', message: 'Meter #M-1023 reporting irregular data', time: '27 min ago' },
        { type: 'info', message: 'Scheduled maintenance tonight 02:00 AM', time: '1 hr ago' },
        { type: 'info', message: 'Monthly report generated', time: '3 hrs ago' }
      ];
      const alertsContainer = document.getElementById('alertsContainer');
      alertsContainer.innerHTML = alerts.map(a => {
        let badgeClass = 'alert-badge';
        if (a.type === 'critical') badgeClass += ' critical';
        else if (a.type === 'warning') badgeClass += ' warning';
        else badgeClass += ' info';
        return `
          <div class="alert-row">
            <div class="alert-info">
              <div class="${badgeClass}"></div>
              <div class="alert-text">${a.message}</div>
            </div>
            <div class="alert-time">${a.time}</div>
          </div>
        `;
      }).join('');

      // ---------- 6. (Optional) dynamic year in footer – not needed but adds TS/JS feel ----------
      // already done with date.

      console.log('⚡ GridSense dashboard initialized — Electricity Management');
    })();
  </script>
  <!-- TypeScript note: For a real TS version, we would compile to this JS.
       The script below simulates typed interfaces in a comment. 
       (We keep it as JS for immediate browser execution.)
  -->
  <!-- 
    // TypeScript interfaces (for reference):
    interface Metric { icon: string; value: string; unit: string; label: string; trend: string; trendUp: boolean; }
    interface ChartItem { day: string; value: number; label: string; }
    interface Device { name: string; status: string; icon: string; power: string; }
    interface Alert { type: 'critical' | 'warning' | 'info'; message: string; time: string; }
  -->
</body>
</html>
